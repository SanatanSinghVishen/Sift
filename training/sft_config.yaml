# =============================================================================
# Sift — SFT Training Configuration
# =============================================================================
# Optimized for NVIDIA RTX 3050 (4 GB VRAM)
# All values are tuned to prevent OOM while maximizing training quality.

model:
  name: "Qwen/Qwen2.5-1.5B-Instruct"
  max_seq_length: 512
  load_in_4bit: true

lora:
  r: 16                     # LoRA rank — 16 is the sweet spot for 1.5B models
  lora_alpha: 32             # Alpha = 2x rank is the standard ratio
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  lora_dropout: 0            # Unsloth optimizes with 0 dropout
  bias: "none"
  use_gradient_checkpointing: "unsloth"   # Unsloth's custom checkpointing

training:
  per_device_train_batch_size: 1       # Minimum for 4 GB VRAM
  gradient_accumulation_steps: 8       # Effective batch size = 8
  num_train_epochs: 2                  # 2 epochs (2,500 steps) for deeper SFT training
  learning_rate: 2.0e-4                # Standard for QLoRA
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  fp16: false
  bf16: true                           # Native bfloat16 precision for Qwen2.5
  logging_steps: 25
  save_strategy: "steps"
  save_steps: 250
  seed: 42
  optim: "adamw_8bit"                  # 8-bit optimizer for memory savings

data:
  dataset_path: "data/sft_dataset.jsonl"
  text_field: "conversations"          # The key containing ChatML messages

output:
  dir: "checkpoints/sft"
